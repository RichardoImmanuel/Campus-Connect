<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Berita – CampusConnect</title>
  <meta name="description" content="Berita dan informasi terkini seputar kampus.">

  <!-- Tailwind CSS via CDN (konfigurasi warna & font ada di tailwind-config.js) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind-config.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

  <!-- CSS tambahan -->
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="berita" class="bg-paper text-ink font-body antialiased min-h-screen flex flex-col">
  <!-- Navbar & footer disisipkan oleh layout.js -->
  <script src="layout.js"></script>

  <main class="flex-1">
    <section class="page-hero on-dark">
      <div class="max-w-6xl mx-auto px-4 py-12 md:py-16">
        <h1 class="font-display font-extrabold text-4xl md:text-5xl">Berita Kampus</h1>
        <p class="mt-3 text-lg text-white/80 max-w-2xl">Informasi terkini dari lingkungan kampus.</p>
      </div>
    </section>

    <section class="max-w-6xl mx-auto px-4 py-10">
      <!-- Pencarian & filter -->
      <div class="bg-white border border-ink/10 rounded-2xl p-4 sm:p-5 space-y-4">
        <div class="search-field" role="search">
          <span data-icon="search" data-icon-class="w-5 h-5 text-ink/50 shrink-0"></span>
          <input id="cari" type="text" autocomplete="off" aria-label="Cari berita"
                 placeholder="Cari berita berdasarkan judul atau kata kunci...">
          <button id="hapusCari" type="button" class="icon-btn" aria-label="Hapus kata kunci" hidden data-icon="x"></button>
        </div>

        <div id="chipKategori" class="flex flex-wrap gap-2" role="group" aria-label="Filter kategori berita"></div>

        <div class="flex flex-wrap items-center gap-3">
          <label class="flex items-center gap-2 text-sm font-semibold" for="urut">
            Urutkan
            <select id="urut" class="field">
              <option value="terbaru">Terbaru</option>
              <option value="terlama">Terlama</option>
            </select>
          </label>
          <button id="tombolTanggal" type="button" class="btn btn-outline" aria-expanded="false" aria-controls="panelTanggal"
                  data-icon="calendar" data-icon-class="w-4 h-4" data-icon-end="chevron">
            Rentang tanggal
          </button>
          <button id="reset" type="button" class="btn btn-outline sm:ml-auto" data-icon="reset" data-icon-class="w-4 h-4">Reset Filter</button>
        </div>

        <div id="panelTanggal" class="collapsible">
          <div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
              <label class="text-sm font-semibold">Dari tanggal
                <input id="dari" type="date" class="field w-full mt-1">
              </label>
              <label class="text-sm font-semibold">Sampai tanggal
                <input id="sampai" type="date" class="field w-full mt-1">
              </label>
            </div>
            <p id="pesanTanggal" class="mt-2 text-sm font-semibold text-coral-deep" role="alert" hidden>Tanggal awal tidak boleh setelah tanggal akhir.</p>
          </div>
        </div>
      </div>

      <p id="ringkasan" class="mt-6 text-sm text-ink/70" aria-live="polite"></p>

      <!-- Kartu berita dibuat otomatis oleh page-berita.js -->
      <div id="news-grid" class="mt-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="page-berita.js"></script>
</body>
</html>
